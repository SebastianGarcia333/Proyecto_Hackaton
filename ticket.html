<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi ticket · Kase</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/ticket.css">
</head>
<body>

  <!-- Navbar -->
  <header class="barra-superior">
    <nav class="container d-flex align-items-center justify-content-between py-2" aria-label="Navegación principal">
      <a href="index.html" class="logotipo">kase<span>.</span></a>
      <div class="d-none d-md-block">
        <a class="enlace-barra" href="index.html#menu">Menú</a>
        <a class="enlace-barra" href="index.html#nosotros">Nosotros</a>
        <a class="enlace-barra" href="index.html#contacto">Dónde estamos</a>
      </div>
      <a class="boton-ticket" href="ticket.html" aria-current="page">Mi ticket <span class="burbuja-ticket">0</span></a>
    </nav>
  </header>

  <main class="pagina-ticket">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <h1 class="pagina-ticket__titulo">Tu ticket</h1>

          <section class="hoja-ticket" aria-label="Productos del pedido">
            <div id="lineasTicket"></div>

            <div class="resumen-ticket">
              <div><span>Subtotal</span><span id="subtotalTicket">$0</span></div>
              <div><span>Domicilio</span><span id="domicilioTicket">$0</span></div>
              <div class="resumen-ticket__total"><span>Total</span><span id="totalTicket">$0</span></div>
            </div>

            <div class="acciones-ticket">
              <button class="boton-kase" id="botonConfirmar" type="button">Confirmar pedido</button>
              <button class="boton-kase boton-kase--claro" id="botonVaciar" type="button">Vaciar ticket</button>
              <a class="boton-kase boton-kase--claro" href="index.html#menu">Seguir pidiendo</a>
            </div>

            <p class="mensaje-final" id="mensajeFinal" role="status"></p>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="js/almacenamiento.js"></script>
  <script src="js/ticket.js"></script>
</body>
</html>
